name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/libs.versions.toml') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --stacktrace || true

      - name: Prepare signing
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No keystore secret, skipping signing"
            echo "signed=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*unsigned*.apk" | head -1)
          if [ -z "$APK_UNSIGNED" ]; then
            APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          fi
          echo "unsigned apk: $APK_UNSIGNED"

          BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          ${BUILD_TOOLS}/apksigner sign \
            --ks release.keystore \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out app-release-signed.apk \
            "$APK_UNSIGNED"

          ${BUILD_TOOLS}/apksigner verify --print-certs app-release-signed.apk
          echo "signed=true" >> $GITHUB_OUTPUT

      - name: Rename artifacts
        run: |
          TAG_NAME="${GITHUB_REF_NAME:-manual}"
          mkdir -p out
          DEBUG_APK=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          cp "$DEBUG_APK" "out/zhiwei-limiter-${TAG_NAME}-debug.apk"
          if [ -f app-release-signed.apk ]; then
            cp app-release-signed.apk "out/zhiwei-limiter-${TAG_NAME}-release.apk"
          fi
          ls -lh out/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zhiwei-limiter-apk
          path: out/*.apk
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          body: |
            ## 知微应用限制 / Zhiwei App Limiter

            ### 更新要点
            - 基于 Shizuku 的应用后台限制工具
            - 未授权自启动的应用，离开前台立即强制停止
            - 支持在系统层限制后台运行与移出省电白名单

            ### What's Changed
            - Shizuku-based background restriction tool
            - Managed apps are force-stopped immediately after leaving foreground
            - System-level background restriction and battery whitelist removal

            ### 下载 / Download
            - `release.apk`：正式签名版 / Signed release build
            - `debug.apk`：调试版 / Debug build

            ### 官方群 / Official Group
            QQ 1137595303

      - name: Cleanup keystore
        if: always()
        run: rm -f release.keystore
